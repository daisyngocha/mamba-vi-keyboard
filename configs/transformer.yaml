# Owner: TF. Chỉ ghi đè phần khác base.yaml.
base: base.yaml
model:
  name: transformer
  d_model: 384
  n_layer: 4
  n_head: 6               # head_dim = 64
  mlp_ratio: 4
  pos_encoding: rope      # RoPE, không dùng learned positional embedding (cần cho thí nghiệm ngoại suy độ dài)
  rope_base: 10000
  attn_backend: efficient # ép SDPBackend.EFFICIENT_ATTENTION khi L lớn để không rơi về backend math O(L²)
